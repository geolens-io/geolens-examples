name: Release dispatch

# geolens-io/geolens dispatches `geolens-release` here the moment a GA release
# publishes (geolens-io/geolens#1609). A release is work in this repo: the same
# client version is written into a dozen files, and the public demo these
# examples run against is redeployed from that release, so the pins go stale
# the moment it ships.
#
# This used to open an issue listing the files to edit, and five releases
# (1.18.0 to 1.20.0) piled up in those issues untouched while the demo moved
# on. An issue hands a person the whole job. So the workflow now does the
# mechanical half itself: `ci/check-pins.py --bump` rewrites every pin, the
# result goes to one rolling pull request, and the full sweep is dispatched on
# it once the packages it installs are published. What is left is the half
# only a person can do: read the release's CHANGELOG for anything an example
# claims, fix that on the same branch, and merge once the sweep is green.
#
# Two limits of the workflow token shape this. It cannot push a change under
# .github/workflows, so no pin may live there (ci/check-pins.py fails if one
# does). And a pull request it opens starts no workflows, which is why the
# sweep is dispatched by hand below. Opening the pull request at all needs
# "Allow GitHub Actions to create and approve pull requests", which the
# geolens-io organisation turns off (checked 2026-09-23). While it is off, the
# workflow opens an issue instead, linking the branch for a person to open the
# pull request from, and the sweep still runs on the branch.
on:
  repository_dispatch:
    types: [geolens-release]

permissions:
  contents: write # push the bump branch
  pull-requests: write # open, retitle and comment on its pull request
  issues: write # the fallback issue, when the pull request cannot be opened
  actions: write # dispatch Verify examples on the branch

# Serialised rather than cancelled: two releases landing close together would
# otherwise race on the same branch. Nothing here is expensive enough to be
# worth cancelling a run that is already bumping.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  BRANCH: chore/pins-auto

jobs:
  pins:
    name: Bump the pins and open the pull request
    runs-on: ubuntu-latest
    # Most of it is the wait for PyPI and npm, bounded at 30 minutes below.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One rolling branch. While its pull request is open, a newer release
      # bumps on top of it, so edits someone already pushed there survive. With
      # no open pull request the branch starts again from main. Only a branch in
      # this repository counts: anyone can open a pull request from a fork
      # whose branch happens to share the name.
      - name: Start from the open bump branch, or from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # What main pins, read before any branch switch, so the pull request
          # always names the whole range a reviewer has to read.
          main_pinned="$(python3 -c 'import importlib.util as u; s = u.spec_from_file_location("p", "ci/check-pins.py"); m = u.module_from_spec(s); s.loader.exec_module(m); print(",".join(sorted({v for _, _, v in m.pins()})))')"
          echo "MAIN_PINNED=${main_pinned}" >> "$GITHUB_ENV"
          open="$(gh pr list --head "$BRANCH" --state open --json number,isCrossRepository \
            --jq 'map(select(.isCrossRepository | not)) | .[0].number // empty')"
          if [ -n "$open" ]; then
            git fetch --depth=1 origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            echo "OPEN_PR=${open}" >> "$GITHUB_ENV"
            echo "building on the open pull request #$open"
          else
            git checkout -B "$BRANCH"
          fi
      - name: Bump the pins if the release is ahead of them
        id: bump
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.version }}
        # No uv and no setup step: ci/check-pins.py declares no dependencies, so
        # the runner's own python3 imports it directly. Importing it is the
        # point: it is the ONE definition of what this repo pins, so a pin form
        # added to its PATTERNS is found and bumped here for free.
        run: |
          python3 - <<'PY'
          import importlib.util
          import os
          import re
          from pathlib import Path


          def append(path_env, text):
              with open(os.environ[path_env], "a", encoding="utf-8") as handle:
                  handle.write(text)


          def summary(line):
              append("GITHUB_STEP_SUMMARY", f"### Release dispatch\n- {line}\n")


          released = os.environ["RELEASE_VERSION"].strip().removeprefix("v")
          # [0-9], not \d: \d also matches digits from other scripts, and the
          # version is written into every pinned file.
          if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", released) is None:
              print(
                  "::warning title=Unusable release version::The dispatch carried version "
                  f"{released!r}, which is not X.Y.Z. Pins not compared."
              )
              summary(f"ignored a dispatch carrying version `{released}`")
              raise SystemExit(0)

          # Its module level does no work and reaches no network; only main()
          # does, behind the usual __main__ guard.
          spec = importlib.util.spec_from_file_location("check_pins", Path("ci/check-pins.py"))
          check_pins = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(check_pins)

          found = check_pins.pins()
          versions = sorted({version for _, _, version in found})
          stuck = [location for location, _, _ in found if location.startswith(check_pins.UNBUMPABLE)]
          if len(versions) != 1 or stuck:
              why = f"the pins here disagree ({versions})" if len(versions) != 1 else f"{stuck} sit under .github/workflows"
              print(
                  f"::warning title=Pins cannot be bumped::{why}, so there is no clean bump to {released}. "
                  "`uv run ci/check-pins.py` is already red; fix that first. Nothing bumped."
              )
              summary(f"could not bump to {released}: {why}")
              raise SystemExit(0)
          pinned = versions[0]


          def parts(version):
              return tuple(int(number) for number in version.split("."))


          if parts(pinned) >= parts(released):
              print(
                  f"::notice title=Pins are current::geolens {released} released; this branch "
                  f"pins {pinned}. Nothing to bump."
              )
              summary(f"geolens {released} released, pins are at {pinned}: nothing to bump")
              raise SystemExit(0)

          files = check_pins.bump(released)
          since = os.environ.get("MAIN_PINNED") or pinned
          notes = f"https://github.com/geolens-io/geolens/releases/tag/v{released}"
          lines = [
              f"GeoLens [{released}]({notes}) is out, and the public demo is redeployed from it.",
              f"This moves every client pin from {since} (what `main` pins) to {released}.",
              "`ci/check-pins.py --bump` rewrote the files below, which are the ones its patterns",
              "match. Once PyPI and npm serve the new packages, the release workflow dispatches",
              "**Verify examples** on this branch: all three engines, the Python, notebook, MCP and",
              "CLI checks. A push here re-runs it the usual way.",
              "",
              "## Before merging",
              "",
              "- [ ] Read the [CHANGELOG](https://github.com/geolens-io/geolens/blob/main/CHANGELOG.md)",
              f"      entries after {since}, up to {released}, for anything an example, a README or a",
              "      comment claims, and fix it on this branch (CLAUDE.md, rule 5).",
              "- [ ] Re-date the lines that record a verification run: the *Pinned versions*",
              "      sections of `python/README.md` and `typescript/README.md`, the `note` in",
              "      `ci/fixtures.json`, and the capture line of the transcript in `mcp/README.md`",
              "      if it was re-captured.",
              "- [ ] Merge once the required checks are green.",
              "",
              "## Files bumped",
              "",
          ]
          lines += [f"- `{name}`" for name in files]
          lines.append("")

          body = Path(os.environ["RUNNER_TEMP"]) / "pin-bump-pr.md"
          body.write_text("\n".join(lines), encoding="utf-8")
          append(
              "GITHUB_OUTPUT",
              f"released={released}\ntitle=chore(pins): bump client pins to {released}\nbody-file={body}\n",
          )
          summary(f"geolens {released} is ahead of the pinned {pinned}; bumped {len(files)} files")
          PY

      - name: Push the bump and open or update the pull request
        id: pr
        if: steps.bump.outputs.released != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASED: ${{ steps.bump.outputs.released }}
          TITLE: ${{ steps.bump.outputs.title }}
          BODY_FILE: ${{ steps.bump.outputs.body-file }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(pins): bump client pins to ${RELEASED}"
          echo "- compare: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${OPEN_PR:-}" ]; then
            # A plain push onto the open pull request's branch, so it can never
            # drop a commit someone added there. The body is left alone, ticked
            # boxes included, and the newer release is a comment instead.
            git push origin "$BRANCH"
            gh pr edit "$OPEN_PR" --title "$TITLE" >/dev/null
            gh pr comment "$OPEN_PR" --body "GeoLens ${RELEASED} is out too, so this branch now pins ${RELEASED}. The CHANGELOG range to read runs up to ${RELEASED}; the checklist above still applies." >/dev/null
            echo "number=${OPEN_PR}" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pin-bump pull request updated::#${OPEN_PR} ${TITLE}"
          else
            # The branch restarted from main, so whatever is left on the remote
            # is stale and a forced push replaces it.
            git push --force origin "$BRANCH"
            if url="$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$BODY_FILE")"; then
              echo "::notice title=Pin-bump pull request opened::${url}"
            else
              # The organisation's Actions policy refuses the workflow token a
              # pull request. One open issue stands in for it, refreshed by
              # each release until someone opens the pull request.
              issue="$RUNNER_TEMP/pin-bump-issue.md"
              {
                echo "The pins are bumped on \`${BRANCH}\`, but this repository's Actions may not open pull requests, so [open it from the branch](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1) with the text below as its description, and close this issue once it merges. Open it before pushing fixes to the branch: while no pull request is open, the next release restarts the branch from main."
                echo
                cat "$BODY_FILE"
              } > "$issue"
              existing="$(gh issue list --state open --limit 100 --json number,title \
                --jq 'map(select(.title | startswith("chore(pins): bump client pins to"))) | .[0].number // empty')"
              if [ -n "$existing" ]; then
                gh issue edit "$existing" --title "$TITLE" --body-file "$issue" >/dev/null
                url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues/${existing}"
              else
                url="$(gh issue create --title "$TITLE" --body-file "$issue")"
              fi
              echo "::warning title=Pin-bump pull request not opened::Actions may not open pull requests here; ${url} links the branch instead."
            fi
            echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
          fi

      # The dispatch can arrive before the packages do: publishing to PyPI and
      # npm waits on a reviewer in geolens's release. A sweep started too early
      # fails on an install and says nothing about the examples, so wait for
      # all four, and say what to run if they are still not there.
      - name: Wait for the packages, then run the sweep on the branch
        if: steps.bump.outputs.released != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASED: ${{ steps.bump.outputs.released }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          published() {
            for package in geolens geolens-cli geolens-mcp; do
              curl -sf -o /dev/null "https://pypi.org/pypi/${package}/${RELEASED}/json" || return 1
            done
            curl -sf -o /dev/null "https://registry.npmjs.org/@geolens/sdk/${RELEASED}"
          }
          for _ in $(seq 1 30); do
            if published; then
              gh workflow run verify.yml --ref "$BRANCH"
              echo "- packages published; Verify examples dispatched on ${BRANCH}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 60
          done
          # The issues endpoint, so the note lands on the fallback issue too.
          gh api "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/comments" -f body="PyPI or npm still did not serve ${RELEASED} after 30 minutes, so no sweep ran. Once all four packages are published, run \`gh workflow run verify.yml --ref ${BRANCH}\` or push to the branch." >/dev/null
          echo "- packages not published after 30 minutes; no sweep dispatched" >> "$GITHUB_STEP_SUMMARY"
