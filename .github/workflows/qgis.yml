name: QGIS example

# qgis/verify.py opens the demo's layers with QGIS's own providers, headless,
# and asserts they load, count right and draw. No hosted runner has QGIS, so it
# runs here in the upstream QGIS image. Monthly rather than on every push: the
# image is over a gigabyte, and the providers it exercises change with QGIS
# releases rather than with commits here.
on:
  schedule:
    - cron: "0 6 1 * *" # first day of the month, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qgis:
    name: QGIS ${{ matrix.qgis }} providers vs live demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The release qgis/README.md walks through (4.2, Qt6) and the current
    # long-term release (3.44 LTR, Qt5), each pinned by digest so a run is
    # reproducible and a bump is a reviewed change. To move one:
    # `docker buildx imagetools inspect qgis/qgis:<tag>` prints the index digest
    # to paste here. When QGIS names its next long-term release, move the LTR row.
    strategy:
      fail-fast: false
      matrix:
        include:
          - qgis: "4.2"
            key: "4.2"
            image: qgis/qgis:4.2.2@sha256:6ffe6b31646247f2e179cb2cc32bb4df215eedc99f387ad59a6cc88ebfe23e21
          - qgis: "3.44 LTR"
            key: "3.44-ltr"
            image: qgis/qgis:3.44.14@sha256:681853565ad03722a0cbcba23985fd211ca927bec2b3d389cb07e0e0412e4184
    container:
      image: ${{ matrix.image }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      # The image ships no git, so checkout falls back to downloading the tree
      # over the REST API. Fine here: nothing in the job reads history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open the demo's layers in QGIS and render them
        run: python3 qgis/verify.py qgis-features.png
      - name: Upload the render
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qgis-render-${{ matrix.key }}
          path: qgis-features.png
          if-no-files-found: ignore
