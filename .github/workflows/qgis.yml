name: QGIS example

# qgis/verify.py opens the demo's layers with QGIS's own providers, headless,
# and asserts they load, count right and draw. No hosted runner has QGIS, so it
# runs here in the upstream QGIS image. Monthly rather than on every push: the
# image is over a gigabyte, and the providers it exercises change with QGIS
# releases rather than with commits here.
on:
  schedule:
    - cron: "0 6 1 * *" # first day of the month, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qgis:
    name: QGIS providers vs live demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The LTR line, pinned by digest so a run is reproducible and a bump is a
    # reviewed change. To move it: `docker buildx imagetools inspect
    # qgis/qgis:<tag>` prints the index digest to paste here.
    container:
      image: qgis/qgis:3.44.13@sha256:59e160b2ea3f881be039ed49936c42e75e8f336688951f22147676db743f4e47
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      # The image ships no git, so checkout falls back to downloading the tree
      # over the REST API. Fine here: nothing in the job reads history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open the demo's layers in QGIS and render them
        run: python3 qgis/verify.py qgis-features.png
      - name: Upload the render
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qgis-render
          path: qgis-features.png
          if-no-files-found: ignore
