name: Verify examples

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC — examples rot silently without this
  workflow_dispatch:

permissions:
  contents: read

# A superseded run tells you nothing about the head of the branch, so stop it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser examples vs live demo
    runs-on: ubuntu-latest
    # Chromium on every push and pull request; all three engines on the weekly
    # and manual runs, where a sweep that takes three times as long costs
    # nobody a review. Actions has no ternary, so both values below use the
    # `cond && a || b` idiom, which is safe here because neither `a` is empty.
    # Written once and read by the install and the sweep both, so the engines
    # installed are the engines swept.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 40 || 15 }}
    env:
      BROWSERS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'chromium,firefox,webkit' || 'chromium' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # First, and before the browser install: when the demo catalog is reset,
      # every dependent example fails in the sweep below with no sign that the
      # cause was the reset. This names the fixture that moved, and tells a
      # demo that is down apart from an example that is broken.
      # Bounded on its own: fifteen probes with three attempts each against a
      # demo that accepts connections and then hangs would otherwise eat most
      # of the job before the sweep started.
      - name: Preflight the demo fixtures
        timeout-minutes: 4
        run: node ci/check-fixtures.mjs
      - name: Install Playwright and the engines this run sweeps
        run: |
          npm init -y >/dev/null
          # Exact version: the render assertions in ci/verify-examples.mjs are
          # calibrated against this browser build, and playwright@1 floats.
          npm install playwright@1.62.1
          # BROWSERS is "chromium" or "chromium,firefox,webkit"; the install
          # wants one argument per engine.
          IFS=, read -ra engines <<<"$BROWSERS"
          if [ "$BROWSERS" = "chromium" ]; then
            # Push and pull-request runs sweep Chromium only, and ubuntu-latest
            # already carries its shared libraries (the image ships Google
            # Chrome). --with-deps would run apt-get for nothing, and on
            # 2026-08-19 that hung on the runners' Ubuntu mirror for the whole
            # 15-minute job budget four times in a row. Firefox and WebKit do
            # need their packages, so the multi-engine sweep keeps --with-deps.
            npx playwright install chromium
          else
            npx playwright install --with-deps "${engines[@]}"
          fi
      - name: Serve the repo
        run: |
          nohup python3 -m http.server 8000 >/tmp/http-server.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:8000/ && exit 0
            sleep 0.5
          done
          echo "http.server never came up on :8000" >&2
          cat /tmp/http-server.log >&2
          exit 1
      - name: Verify every page renders live data
        # Under Xvfb so that Firefox, on the scheduled three-engine runs, can
        # launch headed and get WebGL (see launchOptions in the verifier). For
        # the Chromium-only runs it is a no-op.
        run: xvfb-run -a node ci/verify-examples.mjs
      - name: Re-check the popup XSS fix
        run: node ci/check-popup-safety.mjs
      # The sweep above runs against the public demo, where the catalog probe
      # answers 200, so none of the branches this covers ever execute there.
      - name: Re-check the imagery catalog-probe states
        run: node ci/check-imagery-status.mjs
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-diagnostics
          path: ci/diagnostics/
          if-no-files-found: ignore

  python:
    name: Python examples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # The scripts here are single files with inline dependencies and no
          # lockfile, so the action's cache has nothing to key on and warns on
          # every run that it "will never get invalidated". Resolving them
          # fresh takes seconds.
          enable-cache: false
      # The same client version is written into a dozen files, so one bumped on
      # its own is drift nobody sees until an example stops matching the docs.
      - name: Check version pins
        run: uv run ci/check-pins.py
      # The examples link docs routes and geolens source paths by absolute URL,
      # and nothing on the other side knows they do. A docs page or heading
      # renamed, or a file moved upstream, fails here rather than in a
      # reader's browser.
      - name: Check outbound links
        run: uv run ci/check-links.py
      - name: Run the OGC analysis
        working-directory: python
        run: |
          uv run analyze.py
          test -s subway.png
      # Separate step, so a failure names which script broke rather than
      # reporting that "the python job" failed.
      - name: Run the SDK quickstart
        working-directory: python
        run: uv run sdk-catalog.py
      # Run from the repo root, which is the command the README and the gallery
      # both hand a reader, rather than the working-directory form above. The
      # script asserts its own answers and exits non-zero on a wrong one, so
      # this needs no artifact check the way analyze.py needs its PNG.
      - name: Run the DuckDB query
        run: uv run duckdb/query.py
      # The catalog-as-code example. `apply` is a write and needs a credential,
      # so CI checks the part that runs without one: the manifest still matches
      # the schema this CLI release packages, and that schema still prints.
      - name: Validate the CLI manifest
        run: |
          uvx --from geolens-cli==1.14.0 geolens validate cli/geolens.yaml
          uvx --from geolens-cli==1.14.0 geolens schema >/dev/null

  mcp:
    name: MCP server smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # The scripts here are single files with inline dependencies and no
          # lockfile, so the action's cache has nothing to key on and warns on
          # every run that it "will never get invalidated". Resolving them
          # fresh takes seconds.
          enable-cache: false
      - name: Spawn geolens-mcp against the demo and search
        run: uv run ci/check-mcp.py
