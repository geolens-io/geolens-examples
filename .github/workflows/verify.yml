name: Verify examples

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday is the full three-engine sweep. The other six mornings sweep
    # Chromium only, so a demo reset or a broken release shows up within a
    # day instead of up to a week later. Monday is left out of the daily cron
    # so the two never start together and cancel each other below.
    - cron: "0 6 * * 1"
    - cron: "0 6 * * 0,2-6"
  # geolens-io/geolens can send this after reseeding the demo, so the fixture
  # preflight runs the same day the IDs move (geolens-io/geolens#2142).
  repository_dispatch:
    types: [demo-reseeded]
  workflow_dispatch:

permissions:
  contents: read

# A superseded run tells you nothing about the head of the branch, so stop it.
# Keyed by event as well, so a push to main cannot cancel the scheduled or
# reseed run the alarm job below reads.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser examples vs live demo
    runs-on: ubuntu-latest
    # Chromium on every push, pull request and daily run; all three engines on
    # the Monday schedule and on manual runs (the release workflow dispatches
    # one on each pin bump), where a sweep that takes three times as long
    # costs nobody a review. Actions has no ternary, so both values below use
    # the `cond && a || b` idiom, which is safe here because neither `a` is
    # empty. Written once and read by the install and the sweep both, so the
    # engines installed are the engines swept.
    timeout-minutes: ${{ (github.event.schedule == '0 6 * * 1' || github.event_name == 'workflow_dispatch') && 40 || 15 }}
    env:
      BROWSERS: ${{ (github.event.schedule == '0 6 * * 1' || github.event_name == 'workflow_dispatch') && 'chromium,firefox,webkit' || 'chromium' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # First, and before the browser install: when the demo catalog is reset,
      # every dependent example fails in the sweep below with no sign that the
      # cause was the reset. This names the fixture that moved, and tells a
      # demo that is down apart from an example that is broken.
      # Bounded on its own: fifteen probes with three attempts each against a
      # demo that accepts connections and then hangs would otherwise eat most
      # of the job before the sweep started.
      - name: Preflight the demo fixtures
        timeout-minutes: 4
        run: node ci/check-fixtures.mjs
      - name: Install Playwright and the engines this run sweeps
        run: |
          npm init -y >/dev/null
          # Exact version: the render assertions in ci/verify-examples.mjs are
          # calibrated against this browser build, and playwright@1 floats.
          npm install playwright@1.62.1
          # BROWSERS is "chromium" or "chromium,firefox,webkit"; the install
          # wants one argument per engine.
          IFS=, read -ra engines <<<"$BROWSERS"
          if [ "$BROWSERS" = "chromium" ]; then
            # Push and pull-request runs sweep Chromium only, and ubuntu-latest
            # already carries its shared libraries (the image ships Google
            # Chrome). --with-deps would run apt-get for nothing, and on
            # 2026-08-19 that hung on the runners' Ubuntu mirror for the whole
            # 15-minute job budget four times in a row. Firefox and WebKit do
            # need their packages, so the multi-engine sweep keeps --with-deps.
            npx playwright install chromium
          else
            npx playwright install --with-deps "${engines[@]}"
          fi
      - name: Serve the repo
        run: |
          nohup python3 -m http.server 8000 >/tmp/http-server.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:8000/ && exit 0
            sleep 0.5
          done
          echo "http.server never came up on :8000" >&2
          cat /tmp/http-server.log >&2
          exit 1
      - name: Verify every page renders live data
        # Under Xvfb so that Firefox, on the scheduled three-engine runs, can
        # launch headed and get WebGL (see launchOptions in the verifier). For
        # the Chromium-only runs it is a no-op.
        run: xvfb-run -a node ci/verify-examples.mjs
      - name: Re-check the popup XSS fix
        run: node ci/check-popup-safety.mjs
      # The sweep above runs against the public demo, where the catalog probe
      # answers 200, so none of the branches this covers ever execute there.
      - name: Re-check the imagery catalog-probe states
        run: node ci/check-imagery-status.mjs
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-diagnostics
          path: ci/diagnostics/
          if-no-files-found: ignore

  python:
    name: Python examples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # The scripts here are single files with inline dependencies and no
          # lockfile, so the action's cache has nothing to key on and warns on
          # every run that it "will never get invalidated". Resolving them
          # fresh takes seconds.
          enable-cache: false
      # The same client version is written into a dozen files, so one bumped on
      # its own is drift nobody sees until an example stops matching the docs.
      - name: Check version pins
        run: uv run ci/check-pins.py
      # The examples link docs routes and geolens source paths by absolute URL,
      # and nothing on the other side knows they do. A docs page or heading
      # renamed, or a file moved upstream, fails here rather than in a
      # reader's browser.
      - name: Check outbound links
        run: uv run ci/check-links.py
      # The install line and the claims every GeoLens surface is held to, read
      # from the contract the docs site publishes.
      - name: Check the docs contract
        run: uv run ci/check-contract.py
      - name: Run the OGC analysis
        working-directory: python
        run: |
          uv run analyze.py
          test -s subway.png
      # Separate step, so a failure names which script broke rather than
      # reporting that "the python job" failed.
      - name: Run the SDK quickstart
        working-directory: python
        run: uv run sdk-catalog.py
      # Run from the repo root, which is the command the README and the gallery
      # both hand a reader, rather than the working-directory form above. The
      # script asserts its own answers and exits non-zero on a wrong one, so
      # this needs no artifact check the way analyze.py needs its PNG.
      - name: Run the DuckDB query
        run: uv run duckdb/query.py
      # Executes the actual notebook headlessly with nbclient rather than a
      # copy of its logic, so a cell that raises here is a cell that would
      # raise for a reader running it in Jupyter.
      - name: Run the leafmap notebook
        run: uv run leafmap/verify.py
      # Separate step and separate script from the one above, so a failure
      # names this notebook rather than "the leafmap notebook" generically.
      # Never runs the samgeo section either, for the same reason.
      - name: Run the leafmap + samgeo notebook
        run: uv run leafmap/verify_samgeo.py
      # The catalog-as-code example. `apply` is a write and needs a credential,
      # so CI checks the part that runs without one: the manifest still matches
      # the schema this CLI release packages, and that schema still prints.
      # The CLI version is read from cli/github-actions.yml instead of written
      # here, because the release workflow bumps pins with a token that may not
      # edit anything under .github/workflows (ci/check-pins.py enforces it).
      - name: Validate the CLI manifest
        run: |
          cli="$(grep -oE 'geolens-cli==[0-9]+\.[0-9]+\.[0-9]+' cli/github-actions.yml | head -n 1)"
          test -n "$cli" || { echo "no geolens-cli pin in cli/github-actions.yml" >&2; exit 1; }
          uvx --from "$cli" geolens validate cli/geolens.yaml
          uvx --from "$cli" geolens schema >/dev/null

  mcp:
    name: MCP server smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # The scripts here are single files with inline dependencies and no
          # lockfile, so the action's cache has nothing to key on and warns on
          # every run that it "will never get invalidated". Resolving them
          # fresh takes seconds.
          enable-cache: false
      - name: Spawn geolens-mcp against the demo and search
        run: uv run ci/check-mcp.py

  # A red scheduled run used to be a red dot in the Actions tab and nothing
  # else, which is how the 2026-09-13 demo reset sat unfixed for eight days
  # after the next morning's run had already caught it. On scheduled and
  # reseed runs, a failure opens (or comments on) one tracking issue, and the
  # next green one closes it. Pushes and pull requests are left alone: their
  # failure is already in front of whoever pushed.
  alarm:
    name: Track a red scheduled run
    needs: [browser, python, mcp]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Scheduled verification is red
          RESULTS: ${{ toJSON(needs) }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed="$(jq -r 'to_entries | map(select(.value.result != "success")) | map(.key) | join(", ")' <<<"$RESULTS")"
          # No --search: the search index can lag a just-opened issue and a second
          # one would follow. Open issues here number in the tens.
          existing="$(gh issue list --state open --limit 200 \
            --json number,title --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')"
          if [ -z "$failed" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Green again: $RUN"
            fi
            exit 0
          fi
          body="$(printf '%s\n' \
            "The ${GITHUB_EVENT_NAME} run of **Verify examples** on \`main\` failed in: ${failed}." \
            "" \
            "Run: ${RUN}" \
            "" \
            "Read the **Preflight the demo fixtures** step first (CLAUDE.md, rule 10). When it names a fixture" \
            "that moved, the demo was reset and the IDs need swapping; when it exits 75, the demo was down and" \
            "nothing here is broken. The next green scheduled run closes this issue.")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
