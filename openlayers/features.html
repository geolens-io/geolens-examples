<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GeoLens + OpenLayers: OGC API Features (GeoJSON)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <link href="https://cdn.jsdelivr.net/npm/ol@10.10.0/ol.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/ol@10.10.0/dist/ol.js"></script>
  <style>
    html, body, #map { margin: 0; height: 100%; }
    #map { background: #101418; }
    .popup {
      display: none;
      max-width: 320px;
      max-height: 240px;
      overflow: auto;
      padding: 8px 10px;
      border: 1px solid #2b3440;
      border-radius: 4px;
      background: #1b2129;
      color: #e6edf3;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre;
    }
    /* Page shell: what this is, whether it loaded, where the data came from. */
    #hud { position: absolute; z-index: 2; left: 10px; bottom: 10px; max-width: 44ch; padding: 8px 11px; border-radius: 6px; background: rgba(11, 14, 18, .82); color: #e6edf3; font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; }
    #hud p { margin: 3px 0 0; font-size: 12px; color: #93a1b0; }
    #hud a { color: #4da3ff; }
    #hud .err { color: #ff9d9d; }
  </style>
</head>
<body>
<div id="map"></div>
<div id="popup" class="popup"></div>
<div id="hud">
  <strong>OpenLayers — OGC API Features</strong>
  <p id="status" role="status">Loading NYC subway lines and stations from the GeoLens demo…</p>
  <p>MTA via data.ny.gov · datasets <a href="https://demo.getgeolens.com/datasets/de602fbe-8b30-4755-924f-c9e7fd9613b6">lines</a>, <a href="https://demo.getgeolens.com/datasets/724bf894-dc1a-418c-abc6-555798c44d7c">stations</a> · bigger collections: <a href="../maplibre/features-viewport.html">viewport loader</a> · <a href="../index.html">gallery</a> · <a href="https://github.com/geolens-io/geolens">GeoLens on GitHub</a> · <a href="https://github.com/geolens-io/geolens-examples/blob/main/openlayers/features.html">source</a></p>
</div>
<script>
  // Point this at your own GeoLens instance to use your data.
  const GEOLENS = "https://demo.getgeolens.com";

  // GeoLens serves OGC API Features; the items endpoint returns plain GeoJSON,
  // so ol.source.Vector can point its `url` straight at it. List your
  // collections at /api/collections and substitute the IDs below.
  const LINES = "de602fbe-8b30-4755-924f-c9e7fd9613b6";    // NYC Subway Lines
  const STATIONS = "724bf894-dc1a-418c-abc6-555798c44d7c"; // NYC Subway Stations

  // For a private dataset, prefer the X-Api-Key header. The `url` loader
  // below cannot set one, so that means a custom loader that fetches with
  // the header and calls source.addFeatures(). GeoLens does read ?api_key=
  // off the URL, but a credential in a URL lands in logs and history. See
  // "Authenticating against your own instance" in the README.
  //
  // These URLs pull every feature in one request and hold it all in memory.
  // Fine for these small layers, wrong for a large one; "OGC API Features or
  // vector tiles" in the README says when to switch.
  //
  // `limit` is a page size, not a total, and the server clamps it to an admin
  // ceiling (ogc_items_max_page_size, 1000 by default). Both collections here
  // fit in one page, so nothing is cut. For a collection that does not, see
  // ../maplibre/features-viewport.html, which pages by bbox and follows the
  // rel=next link.
  const items = (id) => `${GEOLENS}/api/collections/${id}/items?limit=2000`;

  // A vector source with a `url` fetches it, so this path needs CORS.
  // Anonymous reads of the OGC routes get the wildcard on any instance; only
  // a request that carries a credential needs this page's exact origin in
  // CORS_ALLOWED_ORIGINS.
  //
  // GeoLens returns CRS84 (lon/lat) GeoJSON, and this map's view is Web
  // Mercator. OpenLayers reconciles that for you: the default loader hands
  // the view's projection to the GeoJSON format as `featureProjection`, and
  // the format's `dataProjection` already defaults to EPSG:4326, so features
  // are reprojected as they are read. No manual transform needed.
  // Drop the "loading" line once both collections are in; on failure say so in
  // the page rather than only in the console.
  const status = document.getElementById("status");
  let pending = 2;

  const source = (id) => {
    const s = new ol.source.Vector({ url: items(id), format: new ol.format.GeoJSON() });
    s.on("featuresloadend", () => { if (--pending === 0 && !status.className) status.hidden = true; });
    s.on("featuresloaderror", () => {
      status.className = "err";
      status.textContent = `Could not read features from ${GEOLENS}. Public anonymous OGC and tile reads need no CORS setup. If this is your own instance, the dataset is probably private or the request carried a credential: list this page's exact origin in CORS_ALLOWED_ORIGINS (a literal "*" is rejected for credentialed CORS).`;
      console.error("GeoLens request failed:", items(id));
    });
    return s;
  };

  const lines = new ol.layer.Vector({
    source: source(LINES),
    style: new ol.style.Style({
      stroke: new ol.style.Stroke({ color: "#4da3ff", width: 2 }),
    }),
  });

  // GeoJSON points have no intrinsic size, so a point style supplies the
  // `image` to draw. A Circle keeps a constant pixel radius as you zoom.
  const stations = new ol.layer.Vector({
    source: source(STATIONS),
    style: new ol.style.Style({
      image: new ol.style.Circle({
        radius: 3.5,
        fill: new ol.style.Fill({ color: "#ffd166" }),
        stroke: new ol.style.Stroke({ color: "#101418", width: 1 }),
      }),
    }),
  });

  const popup = document.getElementById("popup");
  const overlay = new ol.Overlay({
    element: popup,
    positioning: "bottom-center",
    offset: [0, -10],
  });

  const map = new ol.Map({
    target: "map",
    layers: [lines, stations],
    overlays: [overlay],
    view: new ol.View({
      center: ol.proj.fromLonLat([-73.98, 40.73]), // NYC
      zoom: 11,
    }),
  });

  // Features arrive as real GeoJSON, so identify is a client-side lookup —
  // no server round-trip, no GetFeatureInfo.
  map.on("click", (e) => {
    const feature = map.forEachFeatureAtPixel(e.pixel, (f) => f, {
      hitTolerance: 4,
    });
    if (!feature) {
      popup.style.display = "none";
      return;
    }
    // getProperties() includes the geometry under the feature's geometry
    // name; drop it so the popup shows attributes only.
    const props = { ...feature.getProperties() };
    delete props[feature.getGeometryName()];

    popup.textContent = JSON.stringify(props, null, 2);
    popup.style.display = "block";
    overlay.setPosition(e.coordinate);
  });

  map.on("pointermove", (e) => {
    const hit = map.hasFeatureAtPixel(e.pixel, { hitTolerance: 4 });
    map.getTargetElement().style.cursor = hit ? "pointer" : "";
  });
</script>
</body>
</html>
