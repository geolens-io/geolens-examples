<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GeoLens + Leaflet: raster tiles (imagery)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map { margin: 0; height: 100%; }
    #map { background: #101418; }
    /* Page shell: what this is, whether it loaded, where the data came from. */
    #hud { position: absolute; z-index: 1000; left: 10px; bottom: 10px; max-width: 44ch; padding: 8px 11px; border-radius: 6px; background: rgba(11, 14, 18, .82); color: #e6edf3; font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; }
    #hud p { margin: 3px 0 0; font-size: 12px; color: #93a1b0; }
    #hud a { color: #4da3ff; }
    #hud .err { color: #ff9d9d; }
  </style>
</head>
<body>
<div id="map"></div>
<div id="hud">
  <strong>Leaflet — raster tiles</strong>
  <p id="status" role="status">Loading the swissALTI3D Matterhorn DEM from the GeoLens demo…</p>
  <p>swisstopo (OGD) · <a href="https://demo.getgeolens.com/datasets/6f03bafa-34b3-4902-9351-40ce09a8181f">dataset</a> · <a href="https://github.com/geolens-io/geolens-examples/blob/main/leaflet/imagery.html">source</a></p>
</div>
<script>
  // Point this at your own GeoLens instance to use your data.
  const GEOLENS = "https://demo.getgeolens.com";

  // Every raster dataset in GeoLens is served as XYZ tiles. Read the exact
  // template from the dataset's collection metadata (the "tiles" link on
  // /api/collections/<dataset_id>) rather than hand-building it — the link
  // carries the .png extension and a cache-version query the server expects:
  //   /raster-tiles/<dataset_id>/tiles/{z}/{x}/{y}.png?v=<n>
  // For a private dataset, mint a scoped token from
  // GET /api/tiles/token/<dataset_id>/ and use the tile_url it returns. It
  // carries sig, exp and scope, covers that one dataset, and expires on a
  // 15-minute boundary, so between 1 and 16 minutes from now; read expires_in
  // rather than assuming a TTL. A pasted api_key does none of that. See
  // "Authenticating against your own instance" in the README.
  const DEM = "6f03bafa-34b3-4902-9351-40ce09a8181f"; // swissALTI3D Matterhorn DEM

  const map = L.map("map").setView([45.9763, 7.6586], 12); // Matterhorn; [lat, lng]

  // Leaflet requests each tile by assigning to an <img> element's src, and a
  // plain <img> is not subject to CORS, so this example rendered even on
  // GeoLens versions whose /raster-tiles route sent no CORS header. Since
  // v1.13.0 the route does send one (geolens#1464), which is what MapLibre
  // and any other WebGL or fetch()-based loader needs.
  //
  // Reading pixels back is where it matters here: `crossOrigin: true` below,
  // or getImageData() on a canvas these tiles were drawn into, both need the
  // header and both fail against a pre-1.13.0 instance.
  const tiles = L.tileLayer(`${GEOLENS}/raster-tiles/${DEM}/tiles/{z}/{x}/{y}.png?v=1`, {
    tileSize: 256,
    maxZoom: 20,
  }).addTo(map);

  // Drop the "loading" line once the visible tiles are in. Tiles outside the
  // dataset footprint answer 204 and count as errors here, so the failure test
  // is "nothing arrived at all", not "something errored".
  const status = document.getElementById("status");
  let loaded = 0;
  tiles.on("tileload", () => { loaded += 1; });
  tiles.on("load", () => {
    if (loaded) return void (status.hidden = true);
    status.className = "err";
    status.textContent = `No tiles came back from ${GEOLENS}. The dataset may not exist on this instance, or it may be private — a private dataset needs a scoped tile token on the template.`;
    console.error("GeoLens returned no tiles for", DEM);
  });
</script>
</body>
</html>
