<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GeoLens + Leaflet: OGC API Features (GeoJSON)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map { margin: 0; height: 100%; }
    #map { background: #101418; }
    .leaflet-popup-content pre { margin: 0; font-size: 12px; }
    /* Page shell: what this is, whether it loaded, where the data came from. */
    #hud { position: absolute; z-index: 1000; left: 10px; bottom: 10px; max-width: 44ch; padding: 8px 11px; border-radius: 6px; background: rgba(11, 14, 18, .82); color: #e6edf3; font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; }
    #hud p { margin: 3px 0 0; font-size: 12px; color: #93a1b0; }
    #hud a { color: #4da3ff; }
    #hud .err { color: #ff9d9d; }
  </style>
</head>
<body>
<div id="map"></div>
<div id="hud">
  <strong>Leaflet — OGC API Features</strong>
  <p id="status" role="status">Loading NYC subway lines and stations from the GeoLens demo…</p>
  <p>MTA via data.ny.gov · datasets <a href="https://demo.getgeolens.com/datasets/de602fbe-8b30-4755-924f-c9e7fd9613b6">lines</a>, <a href="https://demo.getgeolens.com/datasets/724bf894-dc1a-418c-abc6-555798c44d7c">stations</a> · <a href="https://github.com/geolens-io/geolens-examples/blob/main/leaflet/features.html">source</a></p>
</div>
<script>
  // Point this at your own GeoLens instance to use your data.
  const GEOLENS = "https://demo.getgeolens.com";

  // GeoLens serves OGC API Features; the items endpoint returns plain GeoJSON,
  // which L.geoJSON consumes directly. List your collections at
  // /api/collections and substitute the IDs below.
  const LINES = "de602fbe-8b30-4755-924f-c9e7fd9613b6";    // NYC Subway Lines
  const STATIONS = "724bf894-dc1a-418c-abc6-555798c44d7c"; // NYC Subway Stations

  // For a private dataset, send the key as a header. fetch() takes one
  // directly: fetch(url, { headers: { "X-Api-Key": key } }). GeoLens also
  // reads ?api_key= off the URL, but a credential in a URL lands in logs and
  // history. See "Authenticating against your own instance" in the README.
  //
  // These URLs pull every feature in one request and hold it all in memory.
  // Fine for these small layers, wrong for a large one; "OGC API Features or
  // vector tiles" in the README says when to switch.
  const items = (id) => `${GEOLENS}/api/collections/${id}/items?limit=2000`;

  const map = L.map("map").setView([40.73, -73.98], 11); // NYC; Leaflet takes [lat, lng]

  // Reading the items endpoint with fetch() is a cross-origin request, so it
  // depends on the CORS headers GeoLens sends. The demo allows all origins;
  // on your own instance the page's origin has to be in the CORS config.
  // fetch() fulfils on 404 and 401 as happily as on 200, and the body is then a
  // problem document rather than GeoJSON. L.geoJSON accepts an object with no
  // features without complaining, so skipping this check draws a blank map and
  // reports success.
  const load = (id) =>
    fetch(items(id)).then((r) => {
      if (!r.ok) throw new Error(`${r.status} ${r.statusText} from ${items(id)}`);
      return r.json();
    });

  // Features arrive as real GeoJSON, so identify is a client-side lookup —
  // no server round-trip, no GetFeatureInfo.
  const bindProps = (feature, layer) => {
    const pre = document.createElement("pre");
    pre.textContent = JSON.stringify(feature.properties, null, 2);
    layer.bindPopup(pre);
  };

  // Drop the "loading" line once both collections are in; on failure say so in
  // the page rather than only in the console.
  const status = document.getElementById("status");

  Promise.all([load(LINES), load(STATIONS)])
    .then(([lines, stations]) => {
      L.geoJSON(lines, {
        style: { color: "#4da3ff", weight: 2 },
        onEachFeature: bindProps,
      }).addTo(map);

      // GeoJSON points have no intrinsic size, so Leaflet asks what to draw
      // for each one. circleMarker keeps a constant pixel radius as you zoom.
      L.geoJSON(stations, {
        pointToLayer: (feature, latlng) =>
          L.circleMarker(latlng, {
            radius: 3.5,
            fillColor: "#ffd166",
            fillOpacity: 1,
            color: "#101418",
            weight: 1,
          }),
        onEachFeature: bindProps,
      }).addTo(map);
      status.hidden = true;
    })
    .catch((err) => {
      status.className = "err";
      status.textContent = `Could not read features from ${GEOLENS} — ${err.message}. On your own instance, list this page's origin in CORS_ALLOWED_ORIGINS: it is empty by default, which sends no CORS headers at all, and "*" is rejected.`;
      console.error("GeoLens request failed:", err);
    });
</script>
</body>
</html>
