<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GeoLens + ArcGIS Maps SDK for JS: raster tiles (imagery)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <!-- One pinned module script loads the core API, every component package,
       and the CSS. On 4.x this was a plain <script> plus a themes/*/main.css
       <link>, and modules came from AMD require([...]) instead of $arcgis. -->
  <script type="module" src="https://js.arcgis.com/5.1/"></script>
  <style>
    html, body, arcgis-map { margin: 0; height: 100%; }
    arcgis-map { background: #101418; }
    /* Page shell: what this is, whether it loaded, where the data came from. */
    #hud { position: absolute; z-index: 2; left: 10px; bottom: 32px; max-width: 44ch; padding: 8px 11px; border-radius: 6px; background: rgba(11, 14, 18, .82); color: #e6edf3; font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; }
    #hud p { margin: 3px 0 0; font-size: 12px; color: #93a1b0; }
    #hud a { color: #4da3ff; }
    #hud .err { color: #ff9d9d; }
  </style>
</head>
<body>
<arcgis-map center="-74.04, 40.69" zoom="11">
  <arcgis-zoom slot="top-left"></arcgis-zoom>
</arcgis-map>
<div id="hud">
  <strong>ArcGIS Maps SDK for JavaScript — raster tiles</strong>
  <p id="status" role="status">Loading the Sentinel-2 true-colour scene of New York harbour from the GeoLens demo…</p>
  <p>Contains modified Copernicus Sentinel data · <a href="https://demo.getgeolens.com/datasets/bf1a8df1-5e8f-4f75-9547-038343f37a97">dataset</a> · <a href="../index.html">gallery</a> · <a href="https://github.com/geolens-io/geolens">GeoLens on GitHub</a> · <a href="https://github.com/geolens-io/geolens-examples/blob/main/arcgis-js/imagery.html">source</a></p>
</div>
<script type="module">
  // The SDK uploads tiles into a WebGL texture, so it requests them as
  // CORS-clean images and needs Access-Control-Allow-Origin on every tile
  // response. GeoLens sends it since v1.13.0
  // (https://github.com/geolens-io/geolens/issues/1464); on older instances
  // this map draws empty even though the server returns valid PNGs.

  // Point this at your own GeoLens instance to use your data.
  const GEOLENS = "https://demo.getgeolens.com";

  // Every raster dataset in GeoLens is served as XYZ tiles. Read the exact
  // template from the dataset's collection metadata (the "tiles" link on
  // /api/collections/<dataset_id>) rather than hand-building it. The link
  // carries the .png extension and two cache keys: `v`, the content version,
  // and from GeoLens 1.19.0 `pv`, the publication version, which changes with
  // the dataset's publication status or visibility
  // (https://docs.getgeolens.com/guides/api/ogc/#tile-endpoints). A `v` that
  // is out of date makes the server answer `cache-control: private, no-store`,
  // so every tile is rendered fresh instead of coming from the cache:
  //   /raster-tiles/<dataset_id>/tiles/{z}/{x}/{y}.png?v=<n>&pv=<n>
  // That link uses the XYZ names. Esri spells the same three values
  // {level}/{col}/{row}, so swap the placeholders and leave the rest alone.
  // (WebTileLayer also accepts {z}/{x}/{y} if you would rather not.)
  const SCENE = "bf1a8df1-5e8f-4f75-9547-038343f37a97"; // Sentinel-2 true-colour scene, New York harbour

  // If the catalog cannot be read, the bare route still serves tiles; they
  // just are not tied to a cache key.
  async function tileTemplate() {
    let href = `${GEOLENS}/raster-tiles/${SCENE}/tiles/{z}/{x}/{y}.png`;
    try {
      const r = await fetch(`${GEOLENS}/api/collections/${SCENE}`);
      if (r.ok) href = (await r.json()).links.find((l) => l.rel === "tiles")?.href ?? href;
    } catch {
      // Keep the bare route.
    }
    return href;
  }

  // The demo is anonymous. A tile template cannot send headers, so a private
  // dataset wants a scoped token rather than a permanent key on the URL:
  // GET /api/tiles/token/<dataset_id>/ returns a tile_url already carrying
  // sig, exp and scope, good for that one dataset until a 15-minute boundary
  // (POST /api/tiles/tokens/ mints up to 50 at once). That is between 1 and
  // 16 minutes, not a flat quarter hour: a token minted just before a
  // boundary carries 60 seconds. A long-lived embed has to read expires_in
  // and re-mint against it, or it will serve dead tiles a minute in. Minting for a
  // private dataset is itself authenticated, so something server side holds
  // the key and hands this page tokens. For the OGC API calls in
  // features.html, send X-Api-Key from a request interceptor instead.

  const [Map, WebTileLayer] = await $arcgis.import([
    "@arcgis/core/Map.js",
    "@arcgis/core/layers/WebTileLayer.js",
  ]);

  const scene = new WebTileLayer({
    urlTemplate: (await tileTemplate()).replace("{z}", "{level}").replace("{x}", "{col}").replace("{y}", "{row}"),
    title: "Sentinel-2 true colour, New York harbour",
    // GeoLens serves the standard 256px web-mercator XYZ scheme, which is
    // WebTileLayer's default, so no tileInfo is needed. Requests outside the
    // dataset's footprint answer with empty tiles, which is harmless. If you
    // do bound the layer with fullExtent, express it in the tiling scheme's
    // spatial reference (Web Mercator meters, wkid 102100) — a 4326 extent is
    // silently read as meters and the layer never requests a single tile.
    copyright: "Contains modified Copernicus Sentinel data",
  });

  // No basemap on purpose: Esri's basemaps need an ArcGIS API key and this
  // example runs signed out. With a key set on esriConfig.apiKey you can pass
  // `basemap: "dark-gray-vector"` here.
  const map = new Map({ layers: [scene] });
  const el = document.querySelector("arcgis-map");
  el.map = map;

  // Report on the tiles, not on the layer: WebTileLayer.load() resolves without
  // touching the network, so it would call a dead endpoint a success. The first
  // tile that actually arrives clears the line; if none does, say so.
  const status = document.getElementById("status");
  const fetchTile = scene.fetchTile.bind(scene);
  scene.fetchTile = (...args) => fetchTile(...args).then((tile) => ((status.hidden = true), tile));
  setTimeout(() => {
    if (status.hidden) return;
    status.className = "err";
    status.textContent = `No tiles came back from ${GEOLENS}. Instances older than v1.13.0 send no CORS header on raster tiles, which blocks them here.`;
    console.error("GeoLens returned no tiles for", SCENE);
  }, 12000);
</script>
</body>
</html>
