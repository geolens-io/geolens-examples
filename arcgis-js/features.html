<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GeoLens + ArcGIS Maps SDK for JS: OGC API Features</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <!-- One pinned module script loads the core API, every component package,
       and the CSS. On 4.x this was a plain <script> plus a themes/*/main.css
       <link>, and modules came from AMD require([...]) instead of $arcgis. -->
  <script type="module" src="https://js.arcgis.com/5.1/"></script>
  <style>
    html, body, arcgis-map { margin: 0; height: 100%; }
    /* Nothing is drawn under the data (see the basemap note below), so the
       view is transparent and this shows through. */
    arcgis-map { background: #101418; }
    /* Page shell: what this is, whether it loaded, where the data came from. */
    #hud { position: absolute; z-index: 2; left: 10px; bottom: 32px; max-width: 44ch; padding: 8px 11px; border-radius: 6px; background: rgba(11, 14, 18, .82); color: #e6edf3; font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; }
    #hud p { margin: 3px 0 0; font-size: 12px; color: #93a1b0; }
    #hud a { color: #4da3ff; }
    #hud .err { color: #ff9d9d; }
  </style>
</head>
<body>
<arcgis-map center="-73.98, 40.73" zoom="11">
  <arcgis-zoom slot="top-left"></arcgis-zoom>
</arcgis-map>
<div id="hud">
  <strong>ArcGIS Maps SDK for JavaScript — OGC API Features</strong>
  <p id="status" role="status">Loading NYC subway lines and stations from the GeoLens demo…</p>
  <p>MTA via data.ny.gov · datasets <a href="https://demo.getgeolens.com/datasets/de602fbe-8b30-4755-924f-c9e7fd9613b6">lines</a>, <a href="https://demo.getgeolens.com/datasets/724bf894-dc1a-418c-abc6-555798c44d7c">stations</a> · <a href="../index.html">gallery</a> · <a href="https://github.com/geolens-io/geolens">GeoLens on GitHub</a> · <a href="https://github.com/geolens-io/geolens-examples/blob/main/arcgis-js/features.html">source</a></p>
</div>
<script type="module">
  // Point this at your own GeoLens instance to use your data.
  const GEOLENS = "https://demo.getgeolens.com";

  // OGCFeatureLayer wants the OGC API Features *landing page*, not a collection
  // URL — it discovers /collections/<id> and /items on its own. Keep the
  // trailing slash: a bare /api answers with a redirect that carries no CORS
  // header, so the browser drops it.
  const OGC_API = `${GEOLENS}/api/`;

  // List your collections at /api/collections and substitute the IDs below.
  const LINES = "de602fbe-8b30-4755-924f-c9e7fd9613b6";    // NYC Subway Lines
  const STATIONS = "724bf894-dc1a-418c-abc6-555798c44d7c"; // NYC Subway Stations

  // The demo is anonymous. For a private dataset, register a request
  // interceptor once and every call the SDK makes carries your key as a
  // header, which keeps it out of URLs, logs and history:
  //   const esriConfig = await $arcgis.import("@arcgis/core/config.js");
  //   esriConfig.request.interceptors.push({
  //     urls: OGC_API,
  //     before: (params) => {
  //       params.requestOptions.headers = { "X-Api-Key": "<your-api-key>" };
  //     },
  //   });
  // Anonymous reads of the standards routes get Access-Control-Allow-Origin: *
  // on any instance, with no setup. A request that carries a credential never
  // gets the wildcard: this page's exact origin has to be listed in the
  // instance's CORS_ALLOWED_ORIGINS, and a literal "*" there is rejected for
  // credentialed CORS. Keep the key itself out of the page. See the README.

  const [Map, OGCFeatureLayer, reactiveUtils] = await $arcgis.import([
    "@arcgis/core/Map.js",
    "@arcgis/core/layers/OGCFeatureLayer.js",
    "@arcgis/core/core/reactiveUtils.js",
  ]);

  const lines = new OGCFeatureLayer({
    url: OGC_API,
    collectionId: LINES,
    title: "NYC Subway Lines",
    renderer: {
      type: "simple",
      symbol: { type: "simple-line", color: "#4da3ff", width: 2 },
    },
  });

  const stations = new OGCFeatureLayer({
    url: OGC_API,
    collectionId: STATIONS,
    title: "NYC Subway Stations",
    // The layer needs a unique id per feature and will refuse to load without
    // one. GeoLens emits a numeric GeoJSON `id`, which is the default source,
    // so nothing to configure here — if your own data lacks it, name a numeric
    // attribute with `objectIdField`.
    renderer: {
      type: "simple",
      symbol: {
        type: "simple-marker",
        size: 7,
        color: "#ffd166",
        outline: { color: "#101418", width: 1 },
      },
    },
    // Features arrive as real GeoJSON and the SDK already holds the
    // attributes, so a click is a local lookup against geometry in the
    // browser. This is what replaces a WMS GetFeatureInfo round-trip.
    popupTemplate: {
      title: "{stop_name}",
      content: [{
        type: "fields",
        fieldInfos: [
          { fieldName: "daytime_routes", label: "Routes" },
          { fieldName: "borough", label: "Borough" },
          { fieldName: "division", label: "Division" },
          { fieldName: "structure", label: "Structure" },
          { fieldName: "ada", label: "ADA accessible (1 = yes)" },
        ],
      }],
    },
    copyright: "MTA via data.ny.gov",
  });

  // No basemap on purpose: Esri's basemaps need an ArcGIS API key and this
  // example runs signed out. With a key set on esriConfig.apiKey you can pass
  // `basemap: "dark-gray-vector"` here.
  const map = new Map({ layers: [lines, stations] });
  const el = document.querySelector("arcgis-map");
  el.map = map;

  // Report on what reached the map, not on what loaded. layer.load() only reads
  // the collection and samples /items to infer fields, so it resolves even when
  // the bbox queries that actually draw features fail. Ask the layer view how
  // many features it ended up with instead.
  const status = document.getElementById("status");
  const fail = (message, err) => {
    status.hidden = false;
    status.className = "err";
    status.textContent = message;
    console.error("GeoLens request failed:", err ?? message);
  };

  // Every promise below can sit pending forever rather than reject: viewOnReady()
  // does that while a layer is failing, whenLayerView() while the layer view
  // cannot be created, and the updating watch while a query stalls. So they stay
  // off the error path (awaiting them up front would swallow the load errors this
  // exists to report), and the whole group runs under a deadline. A stalled
  // request has to end as a reported failure, never as "Loading…" forever.
  const drawn = async (layer) => {
    await el.viewOnReady(); // resolves with nothing; the view lands on el.view
    const layerView = await el.view.whenLayerView(layer);
    await reactiveUtils.whenOnce(() => !layerView.updating);
    return layerView.queryFeatureCount();
  };

  // The deadline wraps the whole chain, not just the drawing half: load() sits
  // pending too when the items request stalls rather than refuses. The page
  // settles in about eight seconds against the demo, so this only fires on a
  // genuine stall.
  const stalled = new Promise((resolve) => setTimeout(resolve, 30000, null));

  Promise.race([
    Promise.all([lines.load(), stations.load()]).then(() =>
      Promise.all([drawn(lines), drawn(stations)]),
    ),
    stalled,
  ])
    .then((counts) => {
      if (counts === null) {
        return fail(`${GEOLENS} accepted the connection but never answered. It is reachable, so this is a stall rather than a refusal.`);
      }
      if (counts.some((n) => n > 0)) return void (status.hidden = true);
      fail(`${GEOLENS} answered, but no features reached the map. The collections loaded, so check that their items queries return data for this view.`);
    })
    .catch((err) =>
      fail(`Could not read the OGC API at ${GEOLENS} — ${err.message}. Public anonymous OGC and tile reads need no CORS setup. If this is your own instance, the dataset is probably private or the request carried a credential: list this page's exact origin in CORS_ALLOWED_ORIGINS (a literal "*" is rejected for credentialed CORS).`, err),
    );
</script>
</body>
</html>
