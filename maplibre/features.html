<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GeoLens + MapLibre: OGC API Features (GeoJSON)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body, #map { margin: 0; height: 100%; }
    /* Page shell: what this is, whether it loaded, where the data came from. */
    #hud { position: absolute; z-index: 2; left: 10px; bottom: 10px; max-width: 44ch; padding: 8px 11px; border-radius: 6px; background: rgba(11, 14, 18, .82); color: #e6edf3; font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; }
    #hud p { margin: 3px 0 0; font-size: 12px; color: #93a1b0; }
    #hud a { color: #4da3ff; }
    #hud .err { color: #ff9d9d; }
  </style>
</head>
<body>
<div id="map"></div>
<div id="hud">
  <strong>MapLibre GL JS — OGC API Features</strong>
  <p id="status" role="status">Loading NYC subway lines and stations from the GeoLens demo…</p>
  <p>MTA via data.ny.gov · datasets <a href="https://demo.getgeolens.com/datasets/de602fbe-8b30-4755-924f-c9e7fd9613b6">lines</a>, <a href="https://demo.getgeolens.com/datasets/724bf894-dc1a-418c-abc6-555798c44d7c">stations</a> · <a href="https://github.com/geolens-io/geolens-examples/blob/main/maplibre/features.html">source</a></p>
</div>
<script>
  // Point this at your own GeoLens instance to use your data. The demo is
  // anonymous; a private dataset takes an X-Api-Key header, which MapLibre
  // can attach through its transformRequest option. Keep the key out of the
  // URL. See "Authenticating against your own instance" in the README.
  //
  // The items URLs below pull every feature in one request and hold it all
  // in memory. That suits these small layers and breaks down on a large
  // one; "OGC API Features or vector tiles" in the README says when to
  // switch.
  const GEOLENS = "https://demo.getgeolens.com";

  // GeoLens serves OGC API Features; the items endpoint returns GeoJSON,
  // which MapLibre consumes directly as a geojson source. List your
  // collections at /api/collections and substitute the IDs below.
  const LINES = "de602fbe-8b30-4755-924f-c9e7fd9613b6";    // NYC Subway Lines
  const STATIONS = "724bf894-dc1a-418c-abc6-555798c44d7c"; // NYC Subway Stations

  const items = (id) => `${GEOLENS}/api/collections/${id}/items?limit=2000`;

  const map = new maplibregl.Map({
    container: "map",
    center: [-73.98, 40.73], // NYC
    zoom: 11,
    style: {
      version: 8,
      sources: {
        lines: { type: "geojson", data: items(LINES) },
        stations: { type: "geojson", data: items(STATIONS) },
      },
      layers: [
        { id: "bg", type: "background", paint: { "background-color": "#101418" } },
        {
          id: "subway-lines",
          type: "line",
          source: "lines",
          paint: { "line-color": "#4da3ff", "line-width": 2 },
        },
        {
          id: "subway-stations",
          type: "circle",
          source: "stations",
          paint: {
            "circle-radius": 3.5,
            "circle-color": "#ffd166",
            "circle-stroke-color": "#101418",
            "circle-stroke-width": 1,
          },
        },
      ],
    },
  });

  // Features arrive as real GeoJSON, so identify is a client-side lookup —
  // no server round-trip, no GetFeatureInfo.
  map.on("click", "subway-stations", (e) => {
    const props = e.features[0].properties;
    const pre = document.createElement("pre");
    pre.textContent = JSON.stringify(props, null, 2).slice(0, 500);
    new maplibregl.Popup()
      .setLngLat(e.lngLat)
      .setDOMContent(pre)
      .addTo(map);
  });

  map.addControl(new maplibregl.NavigationControl());

  // Drop the "loading" line once the map settles; on failure say so in the
  // page rather than only in the console.
  const status = document.getElementById("status");
  map.on("idle", () => { if (!status.className) status.hidden = true; });
  map.on("error", (e) => {
    status.hidden = false;
    status.className = "err";
    status.textContent = `Could not load features from ${GEOLENS} — ${e.error?.message ?? "request failed"}. On your own instance, list this page's origin in CORS_ALLOWED_ORIGINS: it is empty by default, which sends no CORS headers at all, and "*" is rejected.`;
    console.error("GeoLens request failed:", e.error ?? e);
  });
</script>
</body>
</html>
