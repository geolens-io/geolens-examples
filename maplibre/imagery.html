<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GeoLens + MapLibre: raster tiles (imagery)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body, #map { margin: 0; height: 100%; }
    /* Page shell: what this is, whether it loaded, where the data came from. */
    #hud { position: absolute; z-index: 2; left: 10px; bottom: 10px; max-width: 44ch; padding: 8px 11px; border-radius: 6px; background: rgba(11, 14, 18, .82); color: #e6edf3; font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; }
    #hud p { margin: 3px 0 0; font-size: 12px; color: #93a1b0; }
    #hud a { color: #4da3ff; }
    #hud .err { color: #ff9d9d; }
  </style>
</head>
<body>
<div id="map"></div>
<div id="hud">
  <strong>MapLibre GL JS — raster tiles</strong>
  <p id="status" role="status">Loading the swissALTI3D Matterhorn DEM from the GeoLens demo…</p>
  <p>swisstopo (OGD) · <a href="https://demo.getgeolens.com/datasets/6f03bafa-34b3-4902-9351-40ce09a8181f">dataset</a> · <a href="https://github.com/geolens-io/geolens-examples/blob/main/maplibre/imagery.html">source</a></p>
</div>
<script>
  // MapLibre fetches tiles CORS-mode for its WebGL textures, so the server
  // must send Access-Control-Allow-Origin on every tile response. GeoLens
  // does since v1.13.0 (https://github.com/geolens-io/geolens/issues/1464);
  // on older instances this map draws empty while <img>-based loaders
  // (Leaflet, OpenLayers) still render the same layer.

  // Point this at your own GeoLens instance to use your data.
  const GEOLENS = "https://demo.getgeolens.com";

  // The demo is anonymous. A tile template cannot send headers, so a private
  // dataset wants a scoped token from GET /api/tiles/token/<dataset_id>/,
  // which returns a ready-made tile_url with sig, exp and scope on it. Use
  // that instead of pasting an api_key into the template; it covers one
  // dataset and expires on a 15-minute boundary, so between 1 and 16 minutes
  // from now. Read expires_in rather than assuming a TTL. See the README.

  // Every raster dataset in GeoLens is served as XYZ tiles. Read the exact
  // template from the dataset's collection metadata (the "tiles" link on
  // /api/collections/<dataset_id>) rather than hand-building it — the link
  // carries the .png extension and a cache-version query the server expects:
  //   /raster-tiles/<dataset_id>/tiles/{z}/{x}/{y}.png?v=<n>
  const DEM = "6f03bafa-34b3-4902-9351-40ce09a8181f"; // swissALTI3D Matterhorn DEM

  const map = new maplibregl.Map({
    container: "map",
    center: [7.6586, 45.9763], // Matterhorn
    zoom: 12,
    style: {
      version: 8,
      sources: {
        dem: {
          type: "raster",
          tiles: [`${GEOLENS}/raster-tiles/${DEM}/tiles/{z}/{x}/{y}.png?v=1`],
          tileSize: 256,
        },
      },
      layers: [
        { id: "bg", type: "background", paint: { "background-color": "#101418" } },
        { id: "dem", type: "raster", source: "dem" },
      ],
    },
  });

  map.addControl(new maplibregl.NavigationControl());

  const status = document.getElementById("status");

  // Only a 404 latches this, and a tile can never clear it: a tile answering
  // is not evidence the dataset exists. MapLibre reports the 204 you get for a
  // dataset that was never there exactly as it reports real imagery — same
  // `data` event, same `state: "loaded"` — so "a tile came back" and "the
  // dataset is there" are different claims. fix(#18)
  let missing = false;

  // Whether the tiles have said anything yet. The catalog note below is the
  // weakest signal on this page and defers to both of these. fix(#18)
  let tileAnswered = false;
  let tileErrored = false;

  const fail = (message, err) => {
    status.hidden = false;
    status.className = "err";
    status.textContent = message;
    console.error("GeoLens request failed:", err ?? message);
  };

  // The catalog answered, but not in a way that settles anything. Say so in the
  // neutral style rather than the error one, and never over the top of what the
  // tiles have already reported — they are the better evidence. Warn rather
  // than error in the console for the same reason: nothing here is known to be
  // broken. fix(#18)
  const note = (message, err) => {
    if (tileAnswered || tileErrored) return;
    status.hidden = false;
    status.className = "";
    status.textContent = message;
    console.warn("GeoLens catalog check was inconclusive:", err ?? message);
  };

  // Clear the line when a tile arrives, rather than when the map goes idle.
  // MapLibre raises this only for a tile that came back, so it doubles as the
  // recovery signal: a transient failure cannot latch red over a map that has
  // since recovered. Tiles outside the footprint answer 204 and MapLibre treats
  // those as ordinary empty tiles, so panning off the data is not a failure.
  map.on("data", (e) => {
    if (!e.tile || e.sourceId !== "dem") return;
    tileAnswered = true;
    if (missing) return;
    status.className = "";
    status.hidden = true;
  });

  map.on("error", (e) => {
    tileErrored = true;
    fail(`Could not load tiles from ${GEOLENS} — ${e.error?.message ?? "request failed"}. Instances older than v1.13.0 send no CORS header on raster tiles, which blocks them here.`, e.error ?? e);
  });

  // The tile route cannot tell you the dataset is gone: it answers 204 both for
  // a tile outside the footprint and for a dataset id that does not exist, so
  // those two look identical from here. The catalog is the only place the
  // difference shows, so ask it once.
  //
  // Read the status rather than just `ok`. This request is deliberately
  // anonymous — the point of a scoped tile token is that no credential reaches
  // the browser — so a rejected or unreachable catalog is a fact about this
  // request, not about the dataset, and claiming otherwise puts a red line over
  // a map that is working. Only 404 carries information about existence, and
  // even that is not conclusive; see the message. fix(#18)
  fetch(`${GEOLENS}/api/collections/${DEM}`).then(
    (r) => {
      if (r.ok) return;
      if (r.status === 404) {
        missing = true;
        fail(`${GEOLENS} has no dataset ${DEM} that this page can see (404). Either it is gone, or it is private — GeoLens answers 404 for a dataset you may not read, and this request carries no credential. List what is public at /api/collections.`);
        return;
      }
      note(`Could not check whether dataset ${DEM} exists (${r.status} ${r.statusText}). That says nothing either way, so trust the map rather than this line.`);
    },
    (err) => note(`Could not reach ${GEOLENS} to check that dataset ${DEM} exists — the request failed outright, which is also what a CORS rejection looks like. The tiles are a separate request and may be fine.`, err),
  );
</script>
</body>
</html>
