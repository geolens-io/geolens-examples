<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GeoLens + MapLibre: vector tiles (MVT)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body, #map { margin: 0; height: 100%; }
    /* Page shell: what this is, whether it loaded, where the data came from. */
    #hud { position: absolute; z-index: 2; left: 10px; bottom: 10px; max-width: 44ch; padding: 8px 11px; border-radius: 6px; background: rgba(11, 14, 18, .82); color: #e6edf3; font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; }
    #hud p { margin: 3px 0 0; font-size: 12px; color: #93a1b0; }
    #hud a { color: #4da3ff; }
    #hud .err { color: #ff9d9d; }
  </style>
</head>
<body>
<div id="map"></div>
<div id="hud">
  <strong>MapLibre GL JS — vector tiles (MVT)</strong>
  <p id="status" role="status">Loading NYC subway lines from the GeoLens demo…</p>
  <p>MTA via data.ny.gov · <a href="https://demo.getgeolens.com/datasets/de602fbe-8b30-4755-924f-c9e7fd9613b6">dataset</a> · <a href="../index.html">gallery</a> · <a href="https://github.com/geolens-io/geolens">GeoLens on GitHub</a> · <a href="https://github.com/geolens-io/geolens-examples/blob/main/maplibre/vector-tiles.html">source</a></p>
</div>
<script>
  // Point this at your own GeoLens instance to use your data. The demo is
  // anonymous. A tile template cannot send headers, so a private dataset
  // wants a scoped token from GET /api/tiles/token/<dataset_id>/. Append
  // its sig, exp and scope here rather than an api_key. The token covers one
  // dataset and expires on a 15-minute boundary, so it can arrive with as
  // little as 60 seconds left: read expires_in and re-mint against that, not
  // against a fixed quarter hour. See the README.
  const GEOLENS = "https://demo.getgeolens.com";

  // GeoLens serves every vector dataset as Mapbox Vector Tiles at
  //   /api/tiles/data.<table_name>/{z}/{x}/{y}.pbf
  // The layer inside each tile is named after the same qualified table.
  const TABLE = "data.nyc_subway_lines_mta";

  const map = new maplibregl.Map({
    container: "map",
    center: [-73.98, 40.73], // NYC
    zoom: 11,
    style: {
      version: 8,
      sources: {
        subway: {
          type: "vector",
          tiles: [`${GEOLENS}/api/tiles/${TABLE}/{z}/{x}/{y}.pbf`],
        },
      },
      layers: [
        { id: "bg", type: "background", paint: { "background-color": "#101418" } },
        {
          id: "subway-lines",
          type: "line",
          source: "subway",
          "source-layer": TABLE,
          paint: { "line-color": "#4da3ff", "line-width": 2 },
        },
      ],
    },
  });

  map.addControl(new maplibregl.NavigationControl());

  // Clear the line when data actually arrives, rather than when the map goes
  // idle. MapLibre raises this event only for a tile that came back, so it also
  // works as the recovery signal: a transient failure cannot latch red over a
  // map that has since recovered.
  // Name the source rather than accepting any tile: on a page with more than
  // one source, a tile from the healthy one would otherwise clear an error
  // raised by the source that is actually broken.
  const status = document.getElementById("status");
  map.on("data", (e) => {
    if (!e.tile || e.sourceId !== "subway") return;
    status.className = "";
    status.hidden = true;
  });
  map.on("error", (e) => {
    status.hidden = false;
    status.className = "err";
    status.textContent = `Could not load tiles from ${GEOLENS} — ${e.error?.message ?? "request failed"}. Public anonymous OGC and tile reads need no CORS setup. If this is your own instance, the dataset is probably private or the request carried a credential: list this page's exact origin in CORS_ALLOWED_ORIGINS (a literal "*" is rejected for credentialed CORS).`;
    console.error("GeoLens request failed:", e.error ?? e);
  });
</script>
</body>
</html>
